services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diag"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/diag
      # ROW_LIMIT: "200"
      # global defaults for the test hooks (per-request overrides exist):
      # CANCEL_SEND_DELAY_MS: "0"
      # CLEANUP_DELAY_MS: "0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
