services:
  db:
    image: postgres:16-alpine
    # wal_level=logical enables logical replication slots for the lag
    # sampler; a finite max_slot_wal_keep_size makes safe_wal_size a real
    # number so the remaining-time extrapolation path is exercisable.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_slot_wal_keep_size=64MB"
      - "-c"
      - "max_wal_size=128MB"
    environment:
      POSTGRES_DB: diag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diag"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/diag
      # ROW_LIMIT: "200"
      # global defaults for the test hooks (per-request overrides exist):
      # CANCEL_SEND_DELAY_MS: "0"
      # CLEANUP_DELAY_MS: "0"
      # replication-slot lag sampler (dedicated short-lived connections):
      # SAMPLE_INTERVAL_MIN_S: "1"
      # SAMPLE_INTERVAL_MAX_S: "3"
      # SAMPLE_CONNECT_TIMEOUT_S: "5"
      # SAMPLE_STATEMENT_TIMEOUT_MS: "5000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
